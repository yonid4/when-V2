services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        API_URL: http://backend:8000
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
